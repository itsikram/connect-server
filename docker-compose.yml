# Matches the live Render Docker service: one container, CPU load balancer
# on PORT, API workers on 4001+.
#
#   docker compose up --build
#
# Point the web/Expo apps at http://localhost:4000 (or your Render URL).

services:
  connect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect_server
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      LB_BACKENDS: ${LB_BACKENDS:-2}
      LB_BACKEND_START_PORT: "4001"
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||4000; require('http').get('http://127.0.0.1:'+p+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
