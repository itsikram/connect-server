version: '3.8'

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: connect_nginx
    ports:
      - "80:80"
      - "443:443"  # Uncomment if using HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-logs:/var/log/nginx
    depends_on:
      - server1
      - server2
      - server3
      - server4
    restart: unless-stopped
    networks:
      - connect_network

  # Server Instance 1
  server1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect_server_1
    environment:
      - PORT=4000
      - NODE_ENV=production
      - PROD_MONGODB_URI=${PROD_MONGODB_URI}
      - DEV_MONGODB_URI=${DEV_MONGODB_URI}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    expose:
      - "4000"
    restart: unless-stopped
    networks:
      - connect_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Server Instance 2
  server2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect_server_2
    environment:
      - PORT=4001
      - NODE_ENV=production
      - PROD_MONGODB_URI=${PROD_MONGODB_URI}
      - DEV_MONGODB_URI=${DEV_MONGODB_URI}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    expose:
      - "4001"
    restart: unless-stopped
    networks:
      - connect_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Server Instance 3
  server3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect_server_3
    environment:
      - PORT=4002
      - NODE_ENV=production
      - PROD_MONGODB_URI=${PROD_MONGODB_URI}
      - DEV_MONGODB_URI=${DEV_MONGODB_URI}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    expose:
      - "4002"
    restart: unless-stopped
    networks:
      - connect_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Server Instance 4
  server4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect_server_4
    environment:
      - PORT=4003
      - NODE_ENV=production
      - PROD_MONGODB_URI=${PROD_MONGODB_URI}
      - DEV_MONGODB_URI=${DEV_MONGODB_URI}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    expose:
      - "4003"
    restart: unless-stopped
    networks:
      - connect_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  connect_network:
    driver: bridge
