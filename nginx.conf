# Nginx Load Balancer Configuration for Connect Server
# This configuration provides load balancing across multiple server instances

upstream connect_backend {
    # Load balancing method: least_conn (least connections)
    # Other options: ip_hash (sticky sessions), least_time, etc.
    least_conn;
    
    # Server instances - adjust ports and add more as needed
    # For Socket.IO, use ip_hash to maintain sticky sessions
    server localhost:4000 max_fails=3 fail_timeout=30s;
    server localhost:4001 max_fails=3 fail_timeout=30s;
    server localhost:4002 max_fails=3 fail_timeout=30s;
    server localhost:4003 max_fails=3 fail_timeout=30s;
    
    # Keep connections alive for better performance
    keepalive 32;
}

# Socket.IO upstream - uses ip_hash for sticky sessions
# This is important for WebSocket connections
upstream socketio_backend {
    ip_hash;  # Sticky sessions for Socket.IO
    
    server localhost:4000 max_fails=3 fail_timeout=30s;
    server localhost:4001 max_fails=3 fail_timeout=30s;
    server localhost:4002 max_fails=3 fail_timeout=30s;
    server localhost:4003 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;  # Change to your domain name
    
    # Increase timeouts for long-running requests
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    
    # Increase buffer sizes
    client_max_body_size 100M;
    proxy_buffering off;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Socket.IO endpoint - must use socketio_backend with ip_hash
    location /socket.io/ {
        proxy_pass http://socketio_backend;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_cache off;
        
        # Timeouts for WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # All other API routes
    location / {
        proxy_pass http://connect_backend;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Connection settings
        proxy_set_header Connection "";
        proxy_redirect off;
        
        # Disable buffering for real-time responses
        proxy_buffering off;
    }
    
    # Logging
    access_log /var/log/nginx/connect_access.log;
    error_log /var/log/nginx/connect_error.log;
}

