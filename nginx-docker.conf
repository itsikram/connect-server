# Nginx Load Balancer Configuration for Connect Server (Docker)
# This configuration is optimized for Docker Compose deployment

upstream connect_backend {
    # Load balancing method: least_conn (least connections)
    least_conn;
    
    # Server instances - using Docker service names
    server server1:4000 max_fails=3 fail_timeout=30s;
    server server2:4001 max_fails=3 fail_timeout=30s;
    server server3:4002 max_fails=3 fail_timeout=30s;
    server server4:4003 max_fails=3 fail_timeout=30s;
    
    # Keep connections alive for better performance
    keepalive 32;
}

# Socket.IO upstream - uses ip_hash for sticky sessions
upstream socketio_backend {
    ip_hash;  # Sticky sessions for Socket.IO
    
    server server1:4000 max_fails=3 fail_timeout=30s;
    server server2:4001 max_fails=3 fail_timeout=30s;
    server server3:4002 max_fails=3 fail_timeout=30s;
    server server4:4003 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Accept any hostname
    
    # Increase timeouts for long-running requests
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    
    # Increase buffer sizes
    client_max_body_size 100M;
    proxy_buffering off;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Socket.IO endpoint - must use socketio_backend with ip_hash
    location /socket.io/ {
        proxy_pass http://socketio_backend;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_cache off;
        
        # Timeouts for WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # All other API routes
    location / {
        proxy_pass http://connect_backend;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Connection settings
        proxy_set_header Connection "";
        proxy_redirect off;
        
        # Disable buffering for real-time responses
        proxy_buffering off;
    }
    
    # Logging
    access_log /var/log/nginx/connect_access.log;
    error_log /var/log/nginx/connect_error.log;
}
