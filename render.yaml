# Render Blueprint — Docker web service with in-container CPU load balancer.
# Create/update from this file, or set the same env vars on an existing service.
services:
  - type: web
    name: connect-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LB_BACKENDS
        value: "2"
      - key: LB_BACKEND_START_PORT
        value: "4001"
      - key: SMTP_FORCE_IPV4
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: Connect
      - key: SMTP_TO
        sync: false
      - key: SMTP_CONNECTION_TIMEOUT
        value: "20000"
      - key: SMTP_GREETING_TIMEOUT
        value: "15000"
      - key: SMTP_SOCKET_TIMEOUT
        value: "30000"
      - key: CHECK_GOOGLE_CLOUD_ON_STARTUP
        value: "true"
      # PORT is injected by Render — do not hardcode it.
      # Add Mongo/Firebase/SMTP secrets in the Render dashboard. Set
      # FIREBASE_SERVICE_ACCOUNT_BASE64 to the base64-encoded service-account JSON.
